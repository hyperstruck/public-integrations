[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperstruck"
version = "0.1.0"
description = "Hyperstruck learning for your agents. Plug in a middleware, your agent gets sharper run over run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Hyperstruck" }]
keywords = ["agents", "learning", "langgraph", "langchain", "memory", "llm"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# `pip install hyperstruck[langgraph]` adds the LangChain v1 / LangGraph host.
langgraph = [
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
]

[project.urls]
Homepage = "https://hyperstruck.com"
Documentation = "https://docs.hyperstruck.com"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperstruck"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
