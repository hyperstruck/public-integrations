[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperstruck"
version = "0.12.0"
description = "Hyperstruck learning for your agents. Plug in a middleware, your agent gets sharper run over run."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hyperstruck" }]
keywords = ["agents", "learning", "langgraph", "langchain", "mcp", "memory", "llm"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# `pip install hyperstruck[langgraph]` adds the LangChain v1 / LangGraph host.
langgraph = [
    "langchain>=1.0,<2",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
]
# `pip install hyperstruck[otel]` pins the OpenTelemetry API and nothing else. It adds no
# code path: the run-key resolver guard-imports the API either way, so a customer already
# running OpenTelemetry gets exact run keys without this extra. It exists so the
# capability can be stated in a lockfile rather than discovered at import, and so the
# version we read against is pinned somewhere a dependency scanner can see.
#
# The API only, never the SDK. OpenTelemetry's own library guidelines say a library
# depends on the API, which is a safe no-op when no SDK is registered and carries no
# transitive dependencies; taking the SDK would push a telemetry backend onto every
# consumer of this package.
otel = [
    "opentelemetry-api>=1.20,<2",
]
[project.urls]
Homepage = "https://hyperstruck.com"
Documentation = "https://docs.hyperstruck.com"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperstruck"]
# Tests live alongside the modules they cover; keep them out of the published wheel.
# The bundled hyper-* skills (SKILL.md and any reference.md under ide/skills/) are
# included automatically as package data, so the installer can copy them out of
# the installed package via importlib.resources.
exclude = ["*_test.py"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests sit next to the source they cover (e.g. redaction_test.py beside redaction.py).
testpaths = ["src"]
# Resolve `import hyperstruck...` by file location so the src-layout tests import
# the package whether or not it is installed editable.
pythonpath = ["src"]
consider_namespace_packages = true
